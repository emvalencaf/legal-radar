<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How a question is answered</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process · legal-radar</p>

#2d3142" stroke-width="1"/><text x="110.0" y="240.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Abstain</text><text x="110.0" y="256.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">nothing is answered</text><rect x="225" y="215" width="160" height="56" rx="6" fill="#f5f5f5"/><rect x="225" y="215" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3"/><text x="305.0" y="240.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Embedding provider</text><text x="305.0" y="256.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">router.yaml fallback</text><path d="M305,215 V156" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/><rect x="420" y="215" width="160" height="56" rx="6" fill="#f5f5f5"/><rect x="420" y="215" width="160" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="500.0" y="240.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Knowledge graph</text><text x="500.0" y="256.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">neo4j · read only</text><path d="M500,215 V156" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/><rect x="483.8" y="181" width="32.4" height="12" rx="2" fill="#f5f5f5"/><text x="500" y="190" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ</text><rect x="615" y="215" width="160" height="56" rx="6" fill="#f5f5f5"/><rect x="615" y="215" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3"/><text x="695.0" y="240.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LLM router</text><text x="695.0" y="256.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">groq · gemini · lmstudio</text><path d="M695,215 V156" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/><rect x="615" y="330" width="160" height="56" rx="6" fill="#f5f5f5"/><rect x="615" y="330" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="695.0" y="355.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Prompt lock</text><text x="695.0" y="371.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">prompts/lock.json</text><path d="M615,358 H597 V145 H615" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/><rect x="810" y="215" width="160" height="56" rx="6" fill="#f5f5f5"/><rect x="810" y="215" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="890.0" y="240.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Validate</text><text x="890.0" y="256.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cited ids ⊆ retrieved context</text><path d="M890,156 V215" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="871.0" y="181" width="38.0" height="12" rx="2" fill="#f5f5f5"/><text x="890" y="190" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHECK</text><text x="30" y="443" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text><line x1="110" y1="440" x2="138" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><text x="146" y="444" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">data flow</text><line x1="219" y1="440" x2="247" y2="440" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/><text x="255" y="444" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">optional / read</text><rect x="355" y="435" width="20" height="11" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="383" y="444" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">the graph</text></svg>
