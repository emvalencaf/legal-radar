<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How quality is measured</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process · legal-radar</p>
    <h1>How quality is measured</h1>

extual</text><rect x="420" y="105" width="160" height="56" rx="6" fill="#f5f5f5"/><rect x="420" y="105" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="500.0" y="130.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Score</text><text x="500.0" y="146.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">citations · paths · abstention</text><rect x="615" y="105" width="160" height="56" rx="6" fill="#f5f5f5"/><rect x="615" y="105" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="695.0" y="130.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Run file</text><text x="695.0" y="146.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">eval-runs/*.json</text><rect x="810" y="105" width="160" height="56" rx="6" fill="#f5f5f5"/><rect x="810" y="105" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="890.0" y="130.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Compare + report</text><text x="890.0" y="146.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">table per metric · html</text><path d="M190,133 H225" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M385,133 H420" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M580,133 H615" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M775,133 H810" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="420" y="215" width="160" height="56" rx="6" fill="#f5f5f5"/><rect x="420" y="215" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3"/><text x="500.0" y="240.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RAGAS grounding</text><text x="500.0" y="256.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">faithfulness · --grounding</text><path d="M500,215 V161" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/><rect x="615" y="215" width="160" height="56" rx="6" fill="#f5f5f5"/><rect x="615" y="215" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3"/><text x="695.0" y="240.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tokens and cost</text><text x="695.0" y="256.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">per system</text><path d="M695,215 V161" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/><line x1="30" y1="305" x2="970" y2="305" stroke="#c9ced8" stroke-width="1"/><text x="30" y="332" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENRICHMENT · eval_enrichment.py</text><rect x="30" y="345" width="160" height="56" rx="6" fill="#f5f5f5"/><rect x="30" y="345" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="110.0" y="370.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gold set</text><text x="110.0" y="386.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hand-validated edges</text><rect x="225" y="345" width="160" height="56" rx="6" fill="#f5f5f5"/><rect x="225" y="345" width="160" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="305.0" y="370.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Enrichment</text><text x="305.0" y="386.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rules + LLM</text><rect x="420" y="345" width="160" height="56" rx="6" fill="#f5f5f5"/><rect x="420" y="345" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="500.0" y="370.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Metrics</text><text x="500.0" y="386.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">precision · recall · F1</text><rect x="615" y="345" width="160" height="56" rx="6" fill="#f5f5f5"/><rect x="615" y="345" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="695.0" y="370.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Quality gates</text><text x="695.0" y="386.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">evaluation.yml</text><rect x="810" y="345" width="160" height="56" rx="6" fill="#f5f5f5"/><rect x="810" y="345" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="890.0" y="370.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Exit code</text><text x="890.0" y="386.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">non-zero if a gate fails</text><path d="M190,373 H225" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M385,373 H420" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M580,373 H615" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M775,373 H810" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><text x="30" y="453" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text><line x1="110" y1="450" x2="138" y2="450" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><text x="146" y="454" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">data flow</text><line x1="219" y1="450" x2="247" y2="450" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/><text x="255" y="454" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">optional / read</text><rect x="355" y="445" width="20" height="11" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="383" y="454" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">system under test</text></svg>
