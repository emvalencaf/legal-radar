[project]
name = "legal-radar"
version = "0.1.0"
description = "A RAG-based project that ingests a given legal topic (pointing to a law) and finds jurisprudence precedents, doctrine, and law amendments via the LexML Brasil portal."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "jsonschema>=4.26.0",
    "langgraph>=1.2.14",
    "neo4j>=6.4.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
prompts = ["langsmith>=0.4"]
eval = [
    "assayer @ git+https://github.com/emvalencaf/assayer",
    "ragas>=0.3",
]

[project.scripts]
legal-radar = "legal_radar.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true  # the eval extra installs assayer from GitHub

[tool.hatch.build.targets.wheel]
packages = ["src/legal_radar"]

[dependency-groups]
dev = [
    "pytest",
    "testcontainers>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# vendored third-party skills are not ours to lint
extend-exclude = [".agents", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-m 'not live'"
markers = ["live: hits the real STF/STJ sources through a browser; run with `pytest -m live`"]
